name: Build Core

on:
  push:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      go-version: ${{ steps.go.outputs.go-version }}
      tags: ${{ steps.set-var.outputs.tags }}
      telegram-ready: ${{ steps.set-var.outputs.telegram-ready }}
      sing-box-version: ${{ steps.set-var.outputs.sing-box-version }}
      should-skip: ${{ steps.check-skip.outputs.should-skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check Skip Condition
        id: check-skip
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" == *"[skip]"* ]]; then
            echo "should-skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Variables
        id: set-var
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            go run -v ./cmd/internal/read_tag --ci --nightly
            VERSION="$version"
          fi
          echo "sing-box-version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=$(cat release/DEFAULT_BUILD_TAGS)" >> "$GITHUB_OUTPUT"
          if [[ -n "$API_HASH" && -n "$API_ID" && -n "$BOT_TOKEN" && -n "$CHAT_ID" ]]; then
            echo "telegram-ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "telegram-ready=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          API_HASH: ${{ secrets.API_HASH }}
          API_ID: ${{ secrets.API_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

  build:
    runs-on: ${{ matrix.runner }}
    needs: prepare
    strategy:
      matrix:
        include:
          - name: windows-amd64
            goos: windows
            goarch: amd64
            goamd64: v1
            runner: windows-latest
            cgo: 0
            go-version: ^1.25.4

          - name: linux-amd64
            goos: linux
            goarch: amd64
            goamd64: v1
            runner: ubuntu-latest
            cgo: 1
            go-version: 'stable'

          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            goamd64: v1
            runner: macos-latest
            cgo: 1
            go-version: ^1.25.3

          - name: android-arm64
            goos: android
            goarch: arm64
            runner: ubuntu-latest
            cgo: 1
            go-version: 'stable'
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Prepare Naive (Linux)
        if: matrix.goos == 'linux'
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
          go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} download-toolchain
          go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} env >> "$GITHUB_ENV"

      - name: Setup NDK
        if: matrix.goos == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
          local-cache: true

      - name: Set Build Tags
        shell: bash
        run: |
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            echo "TAGS=$(cat release/DEFAULT_BUILD_TAGS_WINDOWS)" >> "$GITHUB_ENV"
          else
            echo "TAGS=$(cat release/DEFAULT_BUILD_TAGS)" >> "$GITHUB_ENV"
          fi

      - name: Set Shared LDFLAGS
        shell: bash
        run: |
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VERSION: ${{ needs.prepare.outputs.sing-box-version }}
          BUILD_GOOS: ${{ matrix.goos }}
          BUILD_GOARCH: ${{ matrix.goarch }}
        run: |
          if [[ "${GOOS}" == "android" ]]; then
            export CC=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
            GOOS=$BUILD_GOOS GOARCH=$BUILD_GOARCH build go build -v -trimpath -tags "${TAGS}" \
              -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
              -o sing-box ./cmd/sing-box
          else
            OUTPUT_NAME="sing-box"
            if [[ "${GOOS}" == "windows" ]]; then
              OUTPUT_NAME="sing-box.exe"
            fi
            go build -v -trimpath -tags "${TAGS}" \
              -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
              -o "$OUTPUT_NAME" ./cmd/sing-box
          fi

      - name: Extract libcronet (Linux)
        if: matrix.goos == 'linux'
        run: |
          cd ~/cronet-go
          CGO_ENABLED=0 go run -v ./cmd/build-naive extract-lib --target linux/${{ matrix.goarch }} -o "$GITHUB_WORKSPACE"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: sing-box-${{ matrix.name }}
          path: sing-box*

  release:
    permissions: write-all
    runs-on: ubuntu-latest
    needs:
      - build
      - prepare
    if: ${{ needs.prepare.outputs.should-skip != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get artifacts
        uses: actions/download-artifact@v6

      - name: Rename Artifacts
        run: |
          mv sing-box-windows-amd64/sing-box.exe sing-box_windows_amd64.exe
          mv sing-box-linux-amd64/sing-box sing-box_linux_amd64
          mv sing-box-darwin-amd64/sing-box sing-box_darwin_amd64
          mv sing-box-android-arm64/sing-box sing-box_android_arm64
          find . -maxdepth 1 -type d -empty -delete

      - name: Get Version
        run: |
          git remote add upstream https://github.com/lingqiqi5211/sing-box-p.git
          git fetch --tags --force upstream
          if [ "${{ github.ref_name }}" == "dev-next" ]; then
            echo "TAG=$(git describe --tags $(git rev-list --tags --max-count=1))" >> "$GITHUB_ENV"
          else
            echo "TAG=$(git describe --tags --abbrev=0)" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Set Env
        run: |
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> "$GITHUB_ENV"
        shell: bash

      - name: Tag Repo
        uses: richardsimko/update-tag@v1
        with:
          tag_name: ${{ env.TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          cat > release.txt << 'EOF'
          Release created at  ${{ env.BUILDTIME }}
          EOF

      - name: Upload Prerelease
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        with:
          tag_name: ${{ env.TAG }}
          files: |
            sing-box_*
          prerelease: true
          generate_release_notes: true
          body_path: release.txt

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        with:
          tag_name: ${{ env.TAG }}
          files: |
            sing-box_*
          prerelease: false
          generate_release_notes: true
          body_path: release.txt

      - name: Prepare Context
        id: prepare-context
        env:
          SING_BOX_VERSION: ${{ needs.prepare.outputs.sing-box-version }}
          GO_VERSION: ${{ needs.prepare.outputs.go-version }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          {
            echo 'CONTEXT<<EOF'
            echo -e "sing-box v${SING_BOX_VERSION}\n\n🛠️ Built with Go ${GO_VERSION}\n\n🏷️ Tags: ${TAGS}\n\n✨ Commit:"
            git log -n 8 --pretty=format:'%an/%cn- %s' | grep -E '(lingqiqi|yelnoo|lux5am|xchacha20-poly1305|PuerNya|reF1nd|0xffffharry|dyhkwong)' | sed 's/^[^ ]* //'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Send to Telegram
        if: ${{ needs.prepare.outputs.telegram-ready == 'true' }}
        uses: xireiki/channel-post@v1
        with:
          chat_id: ${{ secrets.CHAT_ID }}
          bot_token: ${{ secrets.BOT_TOKEN }}
          path: sing-box_*
          context: ${{ steps.prepare-context.outputs.CONTEXT }}
          parse_mode: HTML
          large_file: true
          api_id: ${{ secrets.API_ID }}
          api_hash: ${{ secrets.API_HASH }}
          method: sendFile
